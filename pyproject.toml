[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "helpcat"
version = "0.1.0"
description = "Evidence-based extraction of supplied CLI help"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
helpcat = "helpcat.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "hypothesis==6.140.3", "ruff==0.14.0"]
research = ["python-crfsuite==0.9.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
